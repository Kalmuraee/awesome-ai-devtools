name: Discover distinct OpenMagic promotion targets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Discover and qualify targets
        run: |
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations
          import base64, json, os, re, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "User-Agent": "openmagic-target-discovery",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          EXACT = "github.com/kalmuraee/openmagic"
          NOW_YEAR = 2026

          def api(path: str):
              url = path if path.startswith("http") else API + path
              for attempt in range(6):
                  req = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return None
                      if exc.code in (403, 429) and attempt < 5:
                          delay = int(exc.headers.get("Retry-After") or 2 ** attempt)
                          time.sleep(min(delay + 1, 65))
                          continue
                      body = exc.read().decode("utf-8", "replace")
                      raise RuntimeError(f"{exc.code} {url}: {body[:300]}")
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(2 ** attempt)
              raise RuntimeError(url)

          # Existing campaign repository set from the published audit branch.
          audit = api("/repos/Kalmuraee/awesome-ai-devtools/contents/promotion-audit/all-prs.json?ref=openmagic-promotion-audit")
          if not audit or not audit.get("content"):
              raise SystemExit("Published promotion audit was not found")
          audit_payload = json.loads(base64.b64decode(audit["content"]))
          existing_targets = {x["repository"].lower() for x in audit_payload["pull_requests"]}

          # Inventory every public repository owned by Kalmuraee, then identify forks.
          owned = []
          for page in range(1, 11):
              batch = api(f"/users/Kalmuraee/repos?type=owner&sort=full_name&direction=asc&per_page=100&page={page}") or []
              owned.extend(batch)
              if len(batch) < 100:
                  break
          forks = [x for x in owned if x.get("fork")]

          def decode_content(obj):
              if not obj or obj.get("type") != "file" or not obj.get("content"):
                  return ""
              try:
                  return base64.b64decode(obj["content"]).decode("utf-8", "replace")
              except Exception:
                  return ""

          def fetch_text(repo, path, ref):
              encoded = urllib.parse.quote(path, safe="/")
              return decode_content(api(f"/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(ref, safe='')}"))

          positive_name = (
              "awesome-ai", "awesome_ai", "ai-tools", "ai_tools", "ai-dev", "ai_dev",
              "ai-coding", "ai_coding", "coding-agent", "coding_agent", "developer-tools",
              "developer_tools", "devtools", "dev-tools", "generative-ai", "generative_ai",
              "llm-tools", "llm_tools", "awesome-llm", "awesome_llm", "agentic", "awesome-agents",
              "awesome_agents", "awesome-web-development", "awesome_web_development", "awesome-devtools",
          )
          positive_text = (
              "ai coding", "coding assistant", "developer tool", "development tool", "ai-powered tool",
              "generative ai tool", "llm tool", "coding agent", "agentic ai", "web development",
          )
          negative = (
              "cybersecurity", "hacking", "game dev", "game-development", "medical", "papers",
              "research paper", "datasets", "computer vision", "image generation", "audio", "music",
              "robotics", "blockchain", "finance", "trading", "education", "prompt engineering techniques",
              "directory of directories", "security tools", "malware", "pentest",
          )

          def qualify(meta):
              name = (meta.get("name") or "").lower()
              desc = (meta.get("description") or "").lower()
              topics = " ".join(meta.get("topics") or []).lower()
              text = f"{name} {desc} {topics}"
              pos = sum(3 for token in positive_name if token in name) + sum(2 for token in positive_text if token in text)
              neg = sum(6 for token in negative if token in text)
              if any(token in name for token in positive_name):
                  fit = "high" if neg == 0 else "low"
              elif pos >= 4 and neg == 0:
                  fit = "high"
              elif pos >= 2 and neg == 0:
                  fit = "medium"
              else:
                  fit = "low"
              return fit, pos - neg

          ready = []
          rejected_forks = []
          for i, fork in enumerate(forks, 1):
              full = fork["full_name"]
              detail = api(f"/repos/{full}") or {}
              parent = detail.get("parent")
              if not parent:
                  continue
              upstream = parent["full_name"]
              branch = parent.get("default_branch") or "main"
              fit, score = qualify(parent)
              reason = []
              if upstream.lower() in existing_targets:
                  reason.append("already_targeted")
              if parent.get("archived") or parent.get("disabled"):
                  reason.append("inactive_repository")
              if fit == "low":
                  reason.append("topic_mismatch")
              pushed = parent.get("pushed_at") or ""
              try:
                  if pushed and int(pushed[:4]) < NOW_YEAR - 3:
                      reason.append("stale_repository")
              except Exception:
                  pass

              readme_obj = api(f"/repos/{upstream}/readme")
              readme_path = readme_obj.get("path") if readme_obj else None
              readme = decode_content(readme_obj)
              already_listed = EXACT in readme.lower() or bool(re.search(r"\bOpenMagic\b", readme, re.I))
              if already_listed:
                  reason.append("already_lists_openmagic")

              contributing = ""
              contributing_path = None
              for path in ("CONTRIBUTING.md", ".github/CONTRIBUTING.md", "contributing.md"):
                  text = fetch_text(upstream, path, branch)
                  if text:
                      contributing = text
                      contributing_path = path
                      break
              template = ""
              template_path = None
              for path in (".github/PULL_REQUEST_TEMPLATE.md", "PULL_REQUEST_TEMPLATE.md"):
                  text = fetch_text(upstream, path, branch)
                  if text:
                      template = text
                      template_path = path
                      break
              rules_text = f"{contributing}\n{template}".lower()
              if any(term in rules_text for term in ("no self-promotion", "self promotion is not allowed", "do not submit your own")):
                  reason.append("self_promotion_forbidden")
              if any(term in rules_text for term in ("closed to submissions", "not accepting submissions", "no new entries")):
                  reason.append("submissions_closed")

              record = {
                  "upstream": upstream,
                  "fork": full,
                  "default_branch": branch,
                  "fork_default_branch": fork.get("default_branch") or branch,
                  "description": parent.get("description") or "",
                  "stars": int(parent.get("stargazers_count") or 0),
                  "forks": int(parent.get("forks_count") or 0),
                  "pushed_at": parent.get("pushed_at"),
                  "updated_at": parent.get("updated_at"),
                  "topics": parent.get("topics") or [],
                  "fit": fit,
                  "fit_score": score,
                  "readme_path": readme_path,
                  "already_lists_openmagic": already_listed,
                  "contributing_path": contributing_path,
                  "pull_request_template_path": template_path,
                  "reasons": reason,
              }
              if not reason and readme_path:
                  ready.append(record)
              else:
                  rejected_forks.append(record)
              if i % 25 == 0:
                  print(f"checked {i}/{len(forks)} forks")

          # Search additional canonical repositories for a 100+ distinct target ledger.
          searches = [
              'awesome ai coding tools in:name,description archived:false fork:false',
              'awesome ai developer tools in:name,description archived:false fork:false',
              'awesome ai devtools in:name,description archived:false fork:false',
              'awesome coding agents in:name,description archived:false fork:false',
              'awesome agentic ai tools in:name,description archived:false fork:false',
              'awesome generative ai tools in:name,description archived:false fork:false',
              'awesome llm tools in:name,description archived:false fork:false',
              'awesome open source ai tools in:name,description archived:false fork:false',
              'awesome developer tools ai in:name,description archived:false fork:false',
              'awesome devtools in:name,description archived:false fork:false',
              'awesome web development tools ai in:name,description archived:false fork:false',
              'awesome code assistants in:name,description archived:false fork:false',
          ]
          found = {}
          for query in searches:
              q = urllib.parse.quote(query)
              for page in range(1, 3):
                  payload = api(f"/search/repositories?q={q}&sort=stars&order=desc&per_page=100&page={page}") or {}
                  for repo in payload.get("items", []):
                      found[repo["full_name"].lower()] = repo
                  if len(payload.get("items", [])) < 100:
                      break

          fork_by_parent = {x["upstream"].lower(): x["fork"] for x in ready + rejected_forks}
          discovered = []
          for key, repo in found.items():
              if key in existing_targets:
                  continue
              fit, score = qualify(repo)
              if fit == "low" or repo.get("archived") or repo.get("disabled"):
                  continue
              pushed = repo.get("pushed_at") or ""
              try:
                  if pushed and int(pushed[:4]) < NOW_YEAR - 3:
                      continue
              except Exception:
                  pass
              readme_obj = api(f"/repos/{repo['full_name']}/readme")
              if not readme_obj:
                  continue
              readme = decode_content(readme_obj)
              if EXACT in readme.lower() or re.search(r"\bOpenMagic\b", readme, re.I):
                  continue
              discovered.append({
                  "upstream": repo["full_name"],
                  "existing_fork": fork_by_parent.get(key),
                  "default_branch": repo.get("default_branch") or "main",
                  "description": repo.get("description") or "",
                  "stars": int(repo.get("stargazers_count") or 0),
                  "forks": int(repo.get("forks_count") or 0),
                  "pushed_at": repo.get("pushed_at"),
                  "topics": repo.get("topics") or [],
                  "fit": fit,
                  "fit_score": score,
                  "readme_path": readme_obj.get("path"),
              })
          discovered.sort(key=lambda x: (0 if x["existing_fork"] else 1, -x["fit_score"], -x["stars"], x["upstream"].lower()))
          ready.sort(key=lambda x: (-x["fit_score"], -x["stars"], x["upstream"].lower()))

          out = Path("promotion-targets")
          out.mkdir(exist_ok=True)
          summary = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "existing_campaign_unique_repositories": len(existing_targets),
              "public_owned_repositories": len(owned),
              "owned_forks": len(forks),
              "ready_existing_forks": len(ready),
              "rejected_existing_forks": len(rejected_forks),
              "new_qualified_search_targets": len(discovered),
              "new_qualified_targets_with_existing_forks": sum(1 for x in discovered if x["existing_fork"]),
              "combined_distinct_target_ledger": len(existing_targets | {x["upstream"].lower() for x in discovered}),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          (out / "ready-existing-forks.json").write_text(json.dumps(ready, indent=2) + "\n", encoding="utf-8")
          (out / "rejected-existing-forks.json").write_text(json.dumps(rejected_forks, indent=2) + "\n", encoding="utf-8")
          (out / "new-qualified-targets.json").write_text(json.dumps(discovered, indent=2) + "\n", encoding="utf-8")
          lines = [
              "# OpenMagic distinct target discovery", "",
              f"Generated: `{summary['generated_at']}`", "",
              f"- Existing campaign unique repositories: **{summary['existing_campaign_unique_repositories']}**",
              f"- Owned forks inspected: **{summary['owned_forks']}**",
              f"- Untargeted qualified repositories with a usable existing fork: **{summary['ready_existing_forks']}**",
              f"- Qualified search targets not in the existing campaign: **{summary['new_qualified_search_targets']}**",
              f"- Combined distinct target ledger: **{summary['combined_distinct_target_ledger']}**", "",
              "## Ready existing forks", "",
              "| Upstream | Stars | Fit | Fork | README |", "|---|---:|---|---|---|",
          ]
          for x in ready:
              lines.append(f"| {x['upstream']} | {x['stars']} | {x['fit']} | {x['fork']} | {x['readme_path']} |")
          (out / "README.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
          python /tmp/discover.py

      - name: Publish discovery branch
        run: |
          git config user.name "OpenMagic Target Discovery"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B openmagic-target-discovery
          rm -f .github/workflows/openmagic-target-discovery.yml
          git add promotion-targets .github/workflows/openmagic-target-discovery.yml
          git diff --cached --check
          git commit -m "docs: publish distinct OpenMagic target discovery"
          git push --force origin HEAD:openmagic-target-discovery

      - name: Restore fork main to upstream
        if: always()
        run: |
          parent=$(gh api repos/${GITHUB_REPOSITORY} --jq '.parent.full_name')
          branch=$(gh api repos/${GITHUB_REPOSITORY} --jq '.parent.default_branch')
          git fetch https://github.com/${parent}.git ${branch}
          git push --force origin FETCH_HEAD:main
