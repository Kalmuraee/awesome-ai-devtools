name: Prepare clean OpenMagic contribution

on:
  push:
    branches:
      - promotion/openmagic-clean-20260828

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: promotion/openmagic-clean-20260828
          fetch-depth: 0

      - name: Add the single category-matched entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if "Kalmuraee/OpenMagic" in text or "[OpenMagic]" in text:
              raise SystemExit("OpenMagic is already present; refusing to duplicate it")

          anchor = "- [Frontman](https://frontman.sh/) — Open-source AI coding agent that lives in your browser. Click any element, describe changes in plain English, get real code edits with hot reload. Supports Next.js, Vite (React, Vue, Svelte), and Astro.\n"
          entry = "- [OpenMagic](https://github.com/Kalmuraee/OpenMagic) — Open-source AI coding toolbar that overlays a running web app through a local reverse proxy. Click an element, describe a change, review the diff, and apply verified source edits with hot reload; supports major web frameworks and BYOK or local models.\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected one Frontman anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, anchor + entry, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and validate the diff
        run: |
          rm .github/workflows/add-openmagic-clean.yml
          git diff --check
          test "$(git diff --numstat README.md | wc -l)" -eq 1
          test "$(git diff -- README.md | grep -c '^+.*OpenMagic')" -eq 1

      - name: Commit the clean contribution
        run: |
          git config user.name "Khalid Almuraee"
          git config user.email "Khalid.s.almuraee@gmail.com"
          git add README.md .github/workflows/add-openmagic-clean.yml
          git commit -m "Add OpenMagic to UI generators"
          git push origin HEAD:promotion/openmagic-clean-20260828
