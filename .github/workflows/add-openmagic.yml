name: Add OpenMagic

on:
  push:
    branches:
      - add-openmagic

permissions:
  contents: write

jobs:
  update-list:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: add-openmagic
          fetch-depth: 0

      - name: Add OpenMagic to CLI utilities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          entry = "- [OpenMagic](https://github.com/Kalmuraee/OpenMagic) — Open-source AI coding toolbar for any web app. Run `npx openmagic`, select a UI element in the browser, describe a change, review the diff, and apply verified edits to the real source code. Supports multiple LLM providers and local coding CLIs.\n"
          if "github.com/Kalmuraee/OpenMagic" in text or "[OpenMagic]" in text:
              raise SystemExit("OpenMagic is already listed")
          marker = "- [CLIRank]("
          index = text.find(marker)
          if index < 0:
              raise SystemExit("CLI Utilities insertion marker was not found")
          text = text[:index] + entry + text[index:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit clean list change
        run: |
          rm .github/workflows/add-openmagic.yml
          git config user.name "Khalid Almuraee"
          git config user.email "Khalid.s.almuraee@gmail.com"
          git add README.md .github/workflows/add-openmagic.yml
          git diff --cached --check
          git commit -m "Add OpenMagic"
          git push origin HEAD:add-openmagic
